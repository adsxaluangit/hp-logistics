<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HP Logistics – Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #1E6FFF;
            --accent: #00D4FF;
            --dark: #080C18;
            --dark-2: #0D1425;
            --dark-3: #111827;
            --card-border: rgba(255,255,255,0.08);
            --text-primary: #F0F4FF;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --gradient-main: linear-gradient(135deg, #1E6FFF 0%, #00D4FF 100%);
            --font: 'Be Vietnam Pro', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background animated blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.5;
            animation: blobMove 10s ease-in-out infinite alternate;
        }
        .blob-1 { width: 500px; height: 500px; background: rgba(30,111,255,0.2); top: -100px; left: -100px; animation-delay: 0s; }
        .blob-2 { width: 400px; height: 400px; background: rgba(0,212,255,0.15); bottom: -80px; right: -80px; animation-delay: 3s; }
        .blob-3 { width: 300px; height: 300px; background: rgba(30,111,255,0.1); top: 40%; left: 50%; animation-delay: 6s; }

        @keyframes blobMove {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(30px, 20px) scale(1.05); }
        }

        /* Grid background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(30,111,255,0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(30,111,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Login Card */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: 24px;
            background: rgba(13,20,37,0.85);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 48px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(30,111,255,0.1);
            animation: slideUp 0.6s cubic-bezier(0.4,0,0.2,1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .login-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 36px;
            justify-content: center;
        }

        .login-logo img {
            height: 52px;
            width: auto;
            background: white;
            border-radius: 10px;
            padding: 5px 10px;
        }

        .login-logo-text { text-align: left; }
        .login-logo-main { font-size: 1.1rem; font-weight: 800; color: var(--text-primary); display: block; line-height: 1.2; }
        .login-logo-sub { font-size: 0.72rem; color: var(--text-muted); display: block; }

        .login-divider {
            width: 1px;
            height: 40px;
            background: rgba(255,255,255,0.15);
        }

        .login-badge {
            background: rgba(30,111,255,0.12);
            border: 1px solid rgba(30,111,255,0.25);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Title */
        .login-title {
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 36px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px 14px 46px;
            font-family: var(--font);
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input::placeholder { color: var(--text-muted); }

        .form-group input:focus {
            border-color: var(--primary);
            background: rgba(30,111,255,0.06);
            box-shadow: 0 0 0 3px rgba(30,111,255,0.15);
        }

        /* Toggle password */
        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--accent); }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-pw {
            font-size: 0.85rem;
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .forgot-pw:hover { opacity: 0.7; }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--gradient-main);
            border: none;
            border-radius: 12px;
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(30,111,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(30,111,255,0.6);
        }

        .btn-login:active { transform: translateY(0); }

        .btn-login.loading { opacity: 0.8; pointer-events: none; }

        /* Error message */
        .login-error {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            color: #FCA5A5;
            font-size: 0.88rem;
            text-align: center;
            animation: shake 0.4s ease;
        }

        .login-error.show { display: block; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            60% { transform: translateX(8px); }
        }

        /* Footer */
        .login-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .login-footer a { color: var(--primary); text-decoration: none; }
        .login-footer a:hover { color: var(--accent); }

        /* Security badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card { padding: 36px 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="login-card" id="login-card">
        <div class="login-logo">
            <img src="../assets/logo-hp.png" alt="HP Logistics Logo" id="login-logo-img">
            <div class="login-divider"></div>
            <span class="login-badge">ADMIN</span>
        </div>

        <h1 class="login-title">Đăng nhập Quản trị</h1>
        <p class="login-subtitle">Nhập thông tin đăng nhập để vào trang quản lý HP Logistics</p>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <div class="input-wrap">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrap">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Hiện/ẩn mật khẩu">
                        <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg id="eye-closed" style="display:none" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    Ghi nhớ đăng nhập
                </label>
                <a href="#" class="forgot-pw">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-login" id="btn-login">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                <span id="btn-login-text">Đăng nhập</span>
            </button>

            <div class="login-error" id="login-error">
                &#9888; Tên đăng nhập hoặc mật khẩu không đúng. Vui lòng thử lại.
            </div>
        </form>

        <div class="security-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Kết nối bảo mật SSL | HP Logistics Admin v1.0
        </div>

        <div class="login-footer">
            <a href="../index.html">&#8592; Quay về trang chủ</a>
        </div>
    </div>

    <script>
        // ─── Toggle password visibility ───────────
        const togglePw = document.getElementById('toggle-pw');
        const pwInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        togglePw.addEventListener('click', () => {
            const isText = pwInput.type === 'text';
            pwInput.type = isText ? 'password' : 'text';
            eyeOpen.style.display = isText ? 'block' : 'none';
            eyeClosed.style.display = isText ? 'none' : 'block';
        });

        // ─── Login form ───────────────────────────
        const loginForm = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');
        const btnText = document.getElementById('btn-login-text');
        const loginError = document.getElementById('login-error');

        // Default credentials (in real app, use server-side auth)
        const CREDENTIALS = { username: 'admin', password: 'hp@2024' };

        // Check remember me
        const saved = localStorage.getItem('hp_admin_user');
        if (saved) document.getElementById('username').value = saved;

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            loginError.classList.remove('show');
            btnText.textContent = 'Đang xác thực...';
            btnLogin.classList.add('loading');

            setTimeout(() => {
                if (username === CREDENTIALS.username && password === CREDENTIALS.password) {
                    if (remember) localStorage.setItem('hp_admin_user', username);
                    else localStorage.removeItem('hp_admin_user');

                    // Save session
                    localStorage.setItem('hp_admin_logged_in', 'true');
                    localStorage.setItem('hp_admin_name', 'Quản trị viên HP');

                    btnText.textContent = 'Đang vào...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    btnText.textContent = 'Đăng nhập';
                    btnLogin.classList.remove('loading');
                    loginError.classList.add('show');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            }, 1200);
        });
    </script>
</body>
</html>
